name: CD — Deploy to EC2

# Runs automatically after CI passes on main
on:
  workflow_run:
    workflows: ["CI — Test & Lint"]
    branches: [main]
    types: [completed]

jobs:
  deploy:
    name: SSH Deploy to EC2 (3.6.41.251)
    runs-on: ubuntu-latest

    # Only deploy if CI actually passed
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          JWT_SECRET:          ${{ secrets.JWT_SECRET }}
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          S3_BUCKET:           ${{ secrets.S3_BUCKET }}
          EC2_HOST:            ${{ secrets.EC2_HOST }}
        with:
          host:        ${{ secrets.EC2_HOST }}
          username:    ${{ secrets.EC2_USER }}
          key:         ${{ secrets.EC2_SSH_KEY }}
          timeout:     300s
          envs:        MYSQL_ROOT_PASSWORD,JWT_SECRET,GROQ_API_KEY,S3_BUCKET,EC2_HOST
          script: |
            set -e
            APP_DIR="/home/$(whoami)/farmer-ai"

            echo "==> 1/4  Pulling latest code"
            if [ -d "$APP_DIR/.git" ]; then
              git -C "$APP_DIR" fetch --all
              git -C "$APP_DIR" reset --hard origin/main
            else
              git clone https://github.com/simarnoobie/ai-based-farmer-advisory-system.git "$APP_DIR"
            fi

            echo "==> 2/4  Writing .env"
            cat > "$APP_DIR/.env" << EOF
            MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
            JWT_SECRET=${JWT_SECRET}
            GROQ_API_KEY=${GROQ_API_KEY}
            GROQ_MODEL=llama-3.1-8b-instant
            S3_BUCKET=${S3_BUCKET}
            S3_MODEL_KEY=models/trained_farmer_model.h5
            BACKEND_URL=http://${EC2_HOST}:8000
            ALLOWED_ORIGINS=*
            REDIS_URL=redis://redis:6379/0
            EOF

            echo "==> 3/4  Rebuilding containers"
            cd "$APP_DIR"
            docker compose down --remove-orphans
            docker compose up -d --build

            echo "==> 4/4  Health check"
            for i in $(seq 1 30); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health 2>/dev/null || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "✅ Backend is healthy (attempt $i)"
                break
              fi
              echo "   waiting... ($i/30)"
              sleep 5
            done

            echo ""
            echo "=== Deployment complete ==="
            docker compose ps
