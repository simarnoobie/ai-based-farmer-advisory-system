name: CI — Test & Lint

# Runs on every push and pull request to main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run pytest (32 tests)
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Python 3.11 (same as Docker image)
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: Backend/requirements.txt

      # 3. Install production + dev dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Backend/requirements.txt -r Backend/requirements-dev.txt

      # 4. Run the full test suite
      - name: Run tests
        working-directory: Backend
        env:
          JWT_SECRET: ci-test-secret-not-for-production
          DB_PASSWORD: ""
          GROQ_API_KEY: ""
          REDIS_URL: ""
        run: pytest tests/ -v --tb=short

  lint:
    name: Lint with ruff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      # Check for obvious errors (unused imports, undefined names, etc.)
      # Does NOT enforce style — just catches real bugs
      - name: Run ruff (errors only)
        run: ruff check Backend/main.py Backend/punjab_policy_knowledge.py --select=E9,F,UP --ignore=F401
